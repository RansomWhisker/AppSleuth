[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "appsleuth"
version = "1.5.3"
description = "Static security scanner, info, diff and app-data auditor for iOS (IPA) and Android (APK/APKS/XAPK/AAB) apps"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
runtime = ["frida>=16"]

[project.scripts]
appsleuth = "appsleuth.cli:main"

[tool.setuptools]
packages = ["appsleuth"]

[tool.setuptools.package-data]
appsleuth = ["runtime_js/*.js"]

[project.urls]
Homepage = "https://rudranetra.com/tools/appsleuth/"
Source = "https://github.com/RansomWhisker/AppSleuth"
